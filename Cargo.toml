[package]
name = "double_ratchet"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Double Ratchet (X25519, HKDF-SHA256, ChaCha20-Poly1305) with an N-round demo"

[dependencies]
anyhow = "1"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
hex = "0.4"
