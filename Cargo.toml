[package]
name = "double_ratchet_test"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
rand = { version = "0.8", features = ["std"] }
zeroize = "1.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
hex = "0.4.3"
hmac = "0.12.1"

